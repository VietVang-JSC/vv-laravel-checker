name: Dogfood

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    name: Dogfood (package checks its own codebase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml
          coverage: pcov
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Dogfooding: the package gates its own codebase with the exact same
      # toolchain consumers get (phpcs + phpstan + phpunit) via `composer check`.
      # A full `php artisan quality:check` run would need a Laravel application;
      # that scenario is already exercised by the Testbench feature suite
      # (tests/Feature/QualityCheckCommandTest), so this job documents the intent
      # and verifies the package against itself on every push.
      - name: Dogfood check (lint + analyse + test)
        run: composer check