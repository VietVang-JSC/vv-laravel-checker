name: Dogfood

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  dogfood:
    name: Dogfood (package checks its own codebase)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml
          coverage: pcov
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          # composer.lock is gitignored (library convention), so hash composer.json.
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      # Dogfooding part 1: the package gates its own codebase with the exact same
      # toolchain consumers get (phpcs + phpstan + phpunit) via `composer check`.
      - name: Dogfood check (lint + analyse + test)
        run: composer check

      # Dogfooding part 2: run the package's own analyzers over its own shipped
      # code. `composer check` above only proves the *wrapped* third-party tools
      # pass; the 43 custom rules are the differentiator and were previously
      # never exercised against this codebase in CI, so precision claims rested
      # on synthetic fixtures alone.
      #
      # Scope is src/, config/ and bin/ — the code that ships. tests/ is out
      # because it contains deliberately vulnerable analyzer samples (real
      # HARDCODED_SECRET hits, not false positives); fixtures/ is excluded by the
      # shipped analyzers.exclude_paths default.
      #
      # --fail-on=warning is stricter than the shipped default (error) on purpose:
      # a finding in our own code should block a merge, not wait for a release.
      - name: Self-scan (package analyzes its own src with its own analyzers)
        run: >
          php bin/quality-check . --path=src --path=config --path=bin
          --only=custom --fail-on=warning --no-cache --format=console