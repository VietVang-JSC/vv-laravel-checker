name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Testbench 9/10 (the default resolution) require PHP 8.2+. PHP 8.1 is
        # covered by the dedicated `php81` job below, which drops Testbench.
        php:
          - '8.2'
          - '8.3'
        os:
          - ubuntu-latest
          # Windows is not optional here: path normalisation, vscode:// links
          # and the PowerShell branch in Tools/TrivyDownloader are Windows-only
          # code paths that Linux CI never exercises.
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # fileinfo is not enabled by default in the Windows PHP builds, and
          # league/flysystem-local (via laravel/framework) requires ext-fileinfo,
          # so without it the Windows jobs cannot resolve a dependency set at all.
          extensions: mbstring, dom, xml, fileinfo
          coverage: pcov
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2

      # On Windows `composer config cache-files-dir` returns a path that does not
      # exist until the first download, and actions/cache fails outright on a
      # missing path ("Path Validation Error"). Hence the explicit mkdir, run
      # under bash so one command works on both runner images.
      - name: Get composer cache directory
        id: composer-cache
        shell: bash
        run: |
          dir="$(composer config cache-files-dir)"
          echo "dir=$dir" >> $GITHUB_OUTPUT
          mkdir -p "$dir"

      # composer.lock is intentionally not committed (library convention), so
      # hashing it would freeze this key at the empty hash forever. composer.json
      # is the file that actually decides the dependency graph here.
      # continue-on-error: caching is an optimisation; it must never fail the
      # build, whatever the runner image does with the path.
      - name: Cache composer dependencies
        continue-on-error: true
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.php }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint (phpcs)
        run: composer lint

      - name: Analyse (phpstan)
        run: composer analyse

      - name: Test (phpunit)
        run: composer test -- --no-coverage

      - name: Coverage (pcov)
        if: matrix.php == '8.3' && matrix.os == 'ubuntu-latest'
        run: vendor/bin/phpunit --coverage-clover build/coverage.xml

      - name: Upload coverage
        if: matrix.php == '8.3' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-clover
          path: build/coverage.xml

  # composer.json advertises `php: ^8.1`, so 8.1 has to be verified somewhere.
  # Testbench v9/v10 need PHP 8.2+, so on 8.1 the job pins v8 and runs against
  # Laravel 10 — the oldest framework this package supports. That is the point:
  # the lower bound is where incompatibilities surface.
  php81:
    name: PHP 8.1 (lowest supported, Laravel 10)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, dom, xml, fileinfo
          ini-values: error_reporting=E_ALL, display_errors=On
          tools: composer:v2

      # Testbench v9/v10 need PHP 8.2+, so on 8.1 Composer resolves v8, which
      # pairs with Laravel 10 — itself PHP 8.1-compatible. That keeps the
      # framework installed, which matters: without laravel/framework the
      # `config()` helper does not exist, so `phpstan analyse src` fails on
      # Commands/QualityCheckCommand.php:99 ("Function config not found"), and
      # the Feature suite cannot boot at all. v8's Laravel 10 releases do trip
      # Composer's security-audit policy, hence block-insecure below — that
      # policy is about *this project's* dependencies, and Laravel 10 here is a
      # test-time fixture, not something we ship.
      - name: Install dependencies
        run: |
          composer config audit.block-insecure false
          composer require --dev "orchestra/testbench:^8.0" --no-update --no-interaction
          composer update --prefer-dist --no-progress --no-interaction

      - name: Lint (phpcs)
        run: composer lint

      - name: Analyse (phpstan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Test
        run: vendor/bin/phpunit --no-coverage
